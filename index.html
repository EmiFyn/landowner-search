<style>html,body{margin:0;padding:0}
.own-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.own-hint{padding:4px 2px}
.own-count{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin:2px 2px 8px}
.own-c{background:var(--surface);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.own-c.first{margin-top:14px}
.own-c.pick{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.own-fl{font-weight:700;font-size:15px;color:var(--accent-ink);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;word-break:break-all}
.own-chips{display:inline-flex;gap:6px}
.own-chip{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--accent);color:var(--accent-ink);font-weight:400}
.own-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.own-name{font-size:17px;font-weight:600}
.own-st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:2px}
.own-st.ok{background:var(--accent-wash);color:var(--accent-ink)}
.own-st.x{background:#F5E2DD;color:#9C2A16}
.own-dates{font-size:13px;color:var(--ink-2);margin:2px 0 8px}
.own-l{display:grid;grid-template-columns:104px 1fr;gap:8px;font-size:14px;padding:3px 0;border-top:1px dashed var(--line)}
.own-k{color:var(--ink-2);font-size:12.5px}
.own-v{white-space:pre-wrap;word-break:break-word}
.own-v a{color:var(--accent-ink);font-weight:600}
.own-trees{margin-top:6px;font-size:13.5px}
.own-trees summary{cursor:pointer;color:var(--accent-ink);font-weight:600;padding:4px 0}
.own-err{color:#9C2A16;font-size:13.5px;min-height:18px;margin-top:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);font:inherit;text-decoration:underline;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
html, body { padding: 0; margin: 0; }
html, body { padding: 0; margin: 0; }
html, body { padding: 0; margin: 0; }
:root{
  --paper:#ECEEE8; --surface:#F8F9F5; --surface-2:#E3E6DD; --surface-3:#D6DACE;
  --ink:#191D18; --ink-2:#414841; --muted:#6B7269;
  --line:#CDD2C6; --line-soft:#DDE1D7;
  --accent:#2F6B33; --accent-ink:#235026; --accent-wash:#DEEBDD;
  --brand:#2F6B33; --brand-2:#3E8B3B; --brand-deep:#1C4A21;
  --ok:#2F6B33; --ok-wash:#DEEBDD; --warn:#8A6A0E; --warn-wash:#F2E9D2;
  --risk:#A33226; --risk-wash:#F6DED9;
  --display:"Arial Narrow","Segoe UI Semibold",Impact,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  /* what the browser draws for itself follows this, not the device */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#131610; --surface:#1A1E18; --surface-2:#242A20; --surface-3:#2E352A;
  --ink:#E7EAE1; --ink-2:#B4BAAE; --muted:#8B9285;
  --line:#2F3629; --line-soft:#252B21;
  --accent:#6BB273; --accent-ink:#95D09C; --accent-wash:#1B2A1D;
  --brand:#6BB273; --brand-2:#4E9455; --brand-deep:#123016;
  --ok:#6BB273; --ok-wash:#1B2A1D; --warn:#D3A94C; --warn-wash:#2B2517;
  --risk:#E0796A; --risk-wash:#2E1B18;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131610; --surface:#1A1E18; --surface-2:#242A20; --surface-3:#2E352A;
  --ink:#E7EAE1; --ink-2:#B4BAAE; --muted:#8B9285;
  --line:#2F3629; --line-soft:#252B21;
  --accent:#6BB273; --accent-ink:#95D09C; --accent-wash:#1B2A1D;
  --brand:#6BB273; --brand-2:#4E9455; --brand-deep:#123016;
  --ok:#6BB273; --ok-wash:#1B2A1D; --warn:#D3A94C; --warn-wash:#2B2517;
  --risk:#E0796A; --risk-wash:#2E1B18;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.06;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
/* A button with no colour of its own takes the browser's, and the browser's
   follows the DEVICE's light/dark setting rather than the one the crew chose
   in Settings. On a phone set to dark with Acorn set to light, that painted
   every record row's heading near-white on a light card — the functional
   location unreadable on the landing pages. (Keith, 13 Sep 2026.) */
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
/* ---------- the opening screen ----------
   One button, centred, thumb-reachable. The bar is emptied on this view and the
   main padding dropped, so the splash owns the screen the way the FileMaker
   splash did. */
/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;
  align-items:baseline;gap:10px}
.card .hd h2{font-size:20px;font-weight:600}
.card .bd{padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted);font-size:14px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 18px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:500;border-radius:2px;min-height:48px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
/* ---------- record list ---------- */
.rec{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-soft);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
/* pinned to the app's own ink rather than left to inherit: this is the line
   that carries the functional location, and it is the one that must never
   be at the mercy of a browser default */
.rec .r1{font-weight:600;font-size:15.5px;color:var(--ink)}
/* ---------- form ---------- */
.sec{border:1px solid var(--line);background:var(--surface)}
.sec > h3{background:var(--surface-2);padding:11px 16px;font-size:18px;font-weight:600;
  border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec > h3 .ht{display:flex;align-items:center;gap:8px;min-width:0}
/* "what to check" under a scored question */
.infoline{display:flex;align-items:center;gap:8px;margin-top:9px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec > h3 .cnt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--muted);font-weight:400;text-transform:none}
/* A section fills green once everything in it is done and red while it owes an
   explanation, so a missed question is obvious without reading the section. */
.sec > h3.done{background:var(--ok-wash);color:var(--ok);border-bottom-color:var(--ok)}
.sec > h3.done .cnt{color:var(--ok)}
/* the same, in amber, where what is owed came from a middle answer rather than
   the worst one — partially compliant, a conditional pass */
.sec > h3.warnflag{background:var(--warn-wash);color:var(--warn);border-bottom-color:var(--warn)}
.sec > h3.warnflag .cnt{color:var(--warn)}
/* a NO on an assessment sheet blocks live working — marked, but not an error */
.item.block{box-shadow:inset 3px 0 0 var(--risk)}
/* a value the form worked out for itself */
.derived{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;color:var(--accent-ink)}
/* a worked-out value that is itself bad news — a failed audit, a deadline */
.derived.risk{color:var(--risk)}
/* where a sheet this one pulled in has got to */
.shst{display:flex;flex-direction:column;gap:3px;padding:11px 13px;border-radius:2px;border:1px solid var(--line);
  background:var(--surface-2);font-size:14px;line-height:1.4}
/* a sheet drawn inside the section that asked for it */
.inlined{padding:12px 16px 16px;background:var(--surface-2);border-top:1px solid var(--line)}
/* a pack read but not signed for — held, not refused */
.imp.warn{background:var(--warn-wash);border:1px solid var(--warn);color:var(--ink)}
/* the block scales to the panel: it is wide and short, so it reads at width */
.packshot{margin-top:10px;border:1px solid var(--line);border-radius:2px;background:#fff;padding:6px}
/* the worked example under a question */
.item .sub{margin:-3px 0 9px;font-size:13px;color:var(--muted);line-height:1.45}
/* wording reproduced from a controlled document — read only, and it has to
   stand apart from the things the operative fills in */
.stmt{background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent);
  font-size:14px;line-height:1.5;color:var(--ink-2)}
.stmt p{margin:0}
.stmt p + p{margin-top:7px}
/* the line that does not apply is played down, never made hard to read — it is
   still part of the controlled wording */
.stmt.rule p.cond{opacity:.64}
.stmt.rule p.cond.on{opacity:1;font-weight:600}
.stmt.rule p.cond.on.fail{color:var(--risk)}
.stmt.rule p.cond.on.pass{color:var(--ok)}
/* where the answers put the job, applied live */
.verdict{text-align:center;padding:16px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:16px;border-radius:2px;min-height:48px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
/* short pairs (HAVS tool + note) stay side by side even on a phone */
.grid2.pair{grid-template-columns:1fr 1fr;gap:10px}
/* A sign-on line: name, signature, and the two times stacked beside it. Every
   column starts at the top of the signature box, so a row is as tall as the
   pad rather than as tall as the pad plus a column of empty space. */
.fl{display:flex;flex-direction:column;gap:6px}
.fl .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* in a grid, controls sit on the bottom of the cell so a two-line label
   never leaves its field out of line with the one beside it */
.grid2 .fl>:last-child{margin-top:auto}
.fl.full{grid-column:1/-1}
/* ---------- portal (a tile that opens something hosted outside the app) ---------- */
a.btn{text-decoration:none}
/* the consent plan's schedule is the tree table, so it needs room for the work
   agreed against each tree rather than a row of chips */
/* the same five columns the landowner signs against on the sheet, ruled apart
   so each one can be read on its own */
.schwrap{margin-top:2px;overflow-x:auto}
/* the table scrolls sideways rather than squeezing: with the columns now
   fixed, too little width means a species wrapping to four lines rather
   than columns drifting, so it is given room and allowed to scroll */
.schrows{display:flex;flex-direction:column;gap:5px;min-width:560px}
/* Every row is its own grid, so any track that sizes to its content — `auto`,
   or a bare `fr` that content can push out — is computed separately per row and
   the columns stop lining up with the heading. An SD marker on one ref, or a
   long species on one row, was enough to knock the category out of its column.
   So every track is fixed: px where the content is short and known, and
   minmax(0,Nfr) elsewhere so a long value wraps inside its column instead of
   widening it. */
.sr{display:grid;grid-template-columns:58px minmax(0,1.5fr) 40px minmax(0,2.2fr) 74px;
  align-items:center;background:var(--surface-2);border-radius:2px;border-left:3px solid var(--ok)}
/* a clearance is a distance, or the ground when the tree is coming down */
.clrrow{display:flex;gap:8px;align-items:stretch}
.clrrow input{flex:1;min-width:0}
.clrrow .btn{flex:0 0 auto;min-height:0}
.clrrow .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* the folder list — the app's half of the file browser, SharePoint does the rest */
.folders{display:flex;flex-direction:column}
/* a folder that opens away from the app is still a row of the same list */
a.fold{text-decoration:none;color:inherit}
a.fold .fgo{font-size:19px}
/* the web viewer fills the screen under the bar, the way FileMaker's does */
body.portalview main{padding:0}
body.portalview main .wrap{padding:0}
/* ---------- sticky action ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding:11px 0 calc(11px + env(safe-area-inset-bottom))}
/* ---------- sync sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,14,10,.6);display:grid;place-items:end center;padding:0}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);padding:13px 15px;font-size:14px;color:var(--ink-2);line-height:1.45}
.note.risk{border-left-color:var(--risk)}
.note.ok{border-left-color:var(--ok)}
.note.warn{border-left-color:var(--warn)}
/* a word in a sentence that happens to be tappable — a full button here would
   shout louder than the setting it opens */
.lnk{background:none;border:0;padding:0 2px;font:inherit;color:var(--accent);
     text-decoration:underline;text-underline-offset:2px;cursor:pointer;min-height:0}
/* ---- sheet picker ---- */
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
/* ---- sheet blocks ---- */
.sheet-block{border:1px solid var(--line);background:var(--surface)}
.btn.tiny{min-height:36px;padding:7px 12px;font-size:13px;flex:0 0 auto}
/* ---- pdf list ---- */
.pdflist{margin-top:14px;border-top:1px solid var(--line-soft)}
/* the email as it will go out — subject line and body, no mail client involved */
.mailprev{margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:2px;background:var(--surface-2)}
.mailprev pre{margin:0;padding:9px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:210px;overflow:auto}
/* ================= dashboard ================= */
.brandbar{background:var(--surface);border-bottom:1px solid var(--line)}
/* the padlock on the sending account. It sits in the card's heading where a
   count usually goes, big enough to hit deliberately and no bigger — it is not
   a button anybody should press by accident, which is rather the point. */
.padlock{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--muted)}
/* the search box — one row, the glass on the left, a cross on the right once
   there is something to clear. Tall enough to hit with a glove on. */
.searchbar{position:relative;display:flex;align-items:center;margin-bottom:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:3px}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
  font-family:var(--body);font-size:16px;padding:14px 0;outline:none;-webkit-appearance:none}
.searchbar input::placeholder{color:var(--muted)}
.searchbar input::-webkit-search-cancel-button{display:none}
.sechead h2{font-size:21px;font-weight:600}
.sechead .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* form icon on a record row */
.recic{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;
  background:linear-gradient(158deg,var(--brand-2),var(--brand))}
/* ---- item-level notes (equipment sheets) ---- */
.inote{margin-top:8px}
/* an item the paper sheet calls out — tinted, with its own i */
.item.hi{background:var(--risk-wash)}
/* ---- fault form: repeating rows, sketch, photo slots ---- */
.notestrip{padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-soft);
  font-size:13px;color:var(--ink-2);line-height:1.45}
/* the consent plan is drawn wide, because that is how it prints — a full-width
   band across the sheet. The fault plan keeps its height: it carries multiple
   spans and tee-offs and needs the room. */
canvas.sketchpad.wide{aspect-ratio:2.1/1;height:auto;min-height:200px}
.padtext input{width:118px;min-height:32px;padding:0 7px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);border-radius:2px;font:inherit;font-size:14px}
/* shown while the pad holds no tool, so a blank toolbar is explained rather
   than looking broken */
.padidle{padding:7px 9px;border-top:1px solid var(--line);background:var(--accent-wash);
  font-size:11.5px;line-height:1.45;color:var(--accent-ink)}
/* ---- tap to draw / tap to sign ----
   The panel over a sleeping pad. It has to do two contradictory things: be
   obviously tappable, and not hide what has already been drawn underneath it.
   So it is barely tinted, with one pill of a label floating in the middle —
   and it passes scrolling straight through to the page, which is the whole
   point of it being there. */
.sleeve{position:relative;display:block}
/* a sleeping pad is tinted just enough to read as inactive; an empty one a
   little more, since there is nothing under it to see */
.veil::before{content:"";position:absolute;inset:0;background:var(--ink);opacity:.035}
/* pen colour + dash, shown only for the freehand and line tools */
.penbar[hidden]{display:none}
/* a photograph belonging to one question, sitting under it */
.slotgrid.one{grid-template-columns:minmax(0,1fr);max-width:260px}
/* ---- evidence of an agreement given at a distance ---- */
.item.evid .lab .rq{font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--risk)}
/* ---- photos ---- */
.item.photos .phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.phead .k{font-size:14.5px;color:var(--ink-2)}
.phead .k em{font-style:normal;color:var(--muted);font-size:13px}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;
  align-items:baseline;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 18px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:500;border-radius:2px;min-height:48px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:16px;border-radius:2px;min-height:48px}
/* the standalone landowner search adds only this */
input[type=email],input[type=password],input[type=search]{width:100%;padding:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:16px;border-radius:2px;min-height:48px}
body{padding:0 0 40px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{background:var(--brand-deep);color:#fff;padding:14px 0;margin-bottom:16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:19px;color:#fff;line-height:1.1}
@media(min-width:520px){.top h1{font-size:24px}}
.top .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:11px 16px;border-radius:3px;font-size:14px;z-index:40;max-width:90vw}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div>
      <h1>Landowner Search</h1>
      <div class="sub">Consent archive</div>
    </div>
    <button class="btn" id="settingsBtn" style="min-height:38px;padding:8px 12px">Settings</button>
  </div>
</div>
<div class="wrap"><div id="app"></div></div>
<script>/* Landowner Search - the small pieces the search needs to stand on its own.

   The same code runs inside Acorn, where these come from the app around it.
   Here they are the whole app: a settings store, a little IndexedDB, and one
   render() that draws either the search or the settings page. */

var APP_VERSION = "1.0";

/* ---- settings, in localStorage (never landowner data) ---- */
var LS = {
  get: function (k, d) {
    try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---- IndexedDB: the encrypted data, the keys and the log queue ---- */
var _db = null;
function idbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise(function (res, rej) {
    var r = indexedDB.open("landowners", 1);
    r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
    r.onsuccess = function () { _db = r.result; res(_db); };
    r.onerror = function () { rej(r.error); };
  });
}
function idbGet(k) {
  return idbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var q = db.transaction("kv", "readonly").objectStore("kv").get(k);
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
  });
}

/* ---------------- landowner search: users, sign-in and the usage log ----------

   Added 22 Sep 2026. The office lists who may use the search and gives each of
   them their own password. There is no server here to check a password against,
   so the password IS the key:

     landowners.enc  one random data key locks the consents
     users.json      that same data key again, once per user, locked with a key
                     made from their own password (PBKDF2-SHA256, 250k rounds)

   Signing in finds this user's line (by a hash of the address they typed),
   makes the key from their password and opens their copy of the data key. A
   wrong password simply doesn't open it. What the phone keeps is the two keys
   it made - never the password - so it picks up each new publish by itself and
   keeps working with no signal. Taking someone off the list in the office makes
   a new data key, so nothing published after that opens on their phone.

   Everything a user does - signing in, each search, each record opened - goes
   to the office's log. With no signal the entries wait on the phone and go when
   it is back online. */

var OWN_USERS_FILE = "users.json";
var OWN_LOG_MAX = 500;            /* don't hoard for ever if the log is unreachable */
var OWN_LOG_EVERY = 20 * 1000;    /* at most one send this often */
var OWN_LOG_LAST = 0;
var OWN_LOG_BUSY = false;

function ownDeviceId() {
  var d = LS.get("acorn.device.id", "");
  if (!d) {
    var b = new Uint8Array(3); crypto.getRandomValues(b);
    d = Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    LS.set("acorn.device.id", d);
  }
  return d;
}
function ownUsersUrl() {
  var u = ownUrl();
  var q = u.indexOf("?"); if (q >= 0) u = u.slice(0, q);
  var i = u.lastIndexOf("/");
  return (i >= 0 ? u.slice(0, i + 1) : "") + OWN_USERS_FILE;
}
function ownUsersAbs() {
  try { return new URL(ownUsersUrl(), location.href).href; } catch (e) { return ownUsersUrl(); }
}
function ownHex(buf) {
  return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
}
/* the same uid the office works out: sha256(lower-case address + the salt) */
async function ownUid(email, saltB64) {
  var e = new TextEncoder().encode(String(email || "").trim().toLowerCase());
  var s = b64(saltB64 || "");
  var all = new Uint8Array(e.length + s.length);
  all.set(e, 0); all.set(s, e.length);
  return ownHex(await crypto.subtle.digest("SHA-256", all)).slice(0, 24);
}
async function ownWrapKey(password, saltB64, iter) {
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(saltB64), iterations: iter | 0, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt", "encrypt"]);
}
/* open this user's copy of the data key (their name is locked in with it) */
async function ownUnwrap(entry, wrapKey, uid) {
  var raw = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(entry.iv), additionalData: new TextEncoder().encode(uid) },
    wrapKey, b64(entry.wrap));
  var inner = JSON.parse(new TextDecoder().decode(raw));
  return { key: await crypto.subtle.importKey("raw", b64(inner.k), { name: "AES-GCM" }, false, ["decrypt"]),
           name: inner.n || "" };
}

/* ---- the users file, kept on the device like the data ---- */
var OWN_USERS_ERR = "";
async function ownUsersDoc() { try { return await idbGet("owners.users"); } catch (e) { return null; } }
async function ownFetchUsers(loud) {
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    OWN_USERS_ERR = "offline"; return await ownUsersDoc();
  }
  try {
    var u = ownUsersUrl(); u += (u.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
    var r = await fetch(u, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "the office hasn't published it yet (404)" : "the server said " + r.status);
    var doc = await r.json();
    if (!doc || doc.format !== "acorn-users") throw new Error("that file isn't the user list");
    OWN_USERS_ERR = ""; await idbSet("owners.users", doc); return doc;
  } catch (e) {
    OWN_USERS_ERR = (e && e.message) || String(e);
    if (loud) OWN.msg = "Couldn't check the user list just now.";
  }
  return await ownUsersDoc();
}
/* why there is no user list - said plainly, because "no signal" is usually wrong
   on a desktop and hides the real cause (opened from a folder, or not published) */
function ownNoUsersWhy() {
  if (typeof location !== "undefined" && location.protocol === "file:") {
    return "This page was opened straight from a folder, and a browser won't let such a page read " +
           "its data files. Open it from its web address instead (or serve the folder over http).";
  }
  if (OWN_USERS_ERR === "offline" || (typeof navigator !== "undefined" && navigator.onLine === false)) {
    return "This device needs a signal once, to fetch the user list.";
  }
  return "Couldn't fetch " + ownUsersAbs() + " — " + (OWN_USERS_ERR || "no answer") +
         ". A file just published can take a minute or two to appear.";
}

/* ---- the session on this device ---- */
async function ownSession() {
  if (OWN.user) return OWN.user;
  try { OWN.user = await idbGet("owners.session"); } catch (e) { OWN.user = null; }
  return OWN.user;
}
async function ownSignIn(email, password) {
  email = String(email || "").trim();
  if (!email || email.indexOf("@") < 0) throw new Error("Enter the email address the office gave you.");
  var doc = await ownFetchUsers(false);
  if (!doc) throw new Error(ownNoUsersWhy());
  var uid = await ownUid(email, doc.salt);
  var entry = (doc.users || []).filter(function (u) { return u.uid === uid; })[0];
  if (!entry) { await ownLogNow("sign-in refused", email, ""); throw new Error("That address isn't on the office's list."); }
  var wrapKey = await ownWrapKey(password, entry.salt, entry.iter);
  var got;
  try { got = await ownUnwrap(entry, wrapKey, uid); }
  catch (e) { await ownLogNow("sign-in refused", email + " - wrong password", ""); throw new Error("That password doesn't open it."); }
  OWN.user = { email: email, name: got.name, uid: uid, wrap: wrapKey, key: got.key, at: Date.now() };
  OWN.err = "";
  await idbSet("owners.session", OWN.user);
  OWN.needKey = false;
  await ownLog("signed in", "", null, true);
  await ownLoadLocal();
  await ownFetch(true);
}
async function ownSignOut(keepData) {
  await ownLog("signed out", "", null, true);
  OWN.user = null;
  try { await idbSet("owners.session", null); } catch (e) {}
  if (!keepData) { try { await idbSet("owners.enc", null); } catch (e) {} }
  OWN.rows = null; OWN.state = "signin";
}
/* a new data key in the office: open this user's new copy with the key we kept */
async function ownRekey(env) {
  var s = await ownSession();
  if (!s || !s.wrap) return false;
  var doc = await ownFetchUsers(false);
  if (!doc) return false;
  var entry = (doc.users || []).filter(function (u) { return u.uid === s.uid; })[0];
  if (!entry) { OWN.err = "This phone is no longer on the office's list - ask the office."; return false; }
  try {
    var got2 = await ownUnwrap(entry, s.wrap, s.uid);
    s.key = got2.key; s.name = got2.name || s.name;
    OWN.user = s; await idbSet("owners.session", s);
    return true;
  } catch (e) { return false; }
}

/* ---- the usage log ----
   Entries are queued on the phone and sent in batches. Queue changes go through
   one promise chain, so a send and a new entry can't overwrite each other, and
   each entry carries an id so a batch that went up is removed by id rather than
   by position - nothing is sent twice and nothing is lost. */
var OWN_LOG_CHAIN = Promise.resolve();
var OWN_LOG_SEQ = 0;
async function ownLogQueue() { try { return (await idbGet("owners.log")) || []; } catch (e) { return []; } }
function ownQueueUpdate(fn) {
  OWN_LOG_CHAIN = OWN_LOG_CHAIN.then(async function () {
    var q = await ownLogQueue();
    var next = await fn(q.slice());
    if (next) await idbSet("owners.log", next.slice(-OWN_LOG_MAX));
  }).catch(function () {});
  return OWN_LOG_CHAIN;
}
async function ownLog(action, detail, count, now) {
  var s = OWN.user || await ownSession();
  var doc = await ownUsersDoc();
  if (!doc || !doc.log || !doc.log.url) return;      /* office hasn't set a log up */
  var entry = {
    id: Date.now() + "-" + (OWN_LOG_SEQ++),
    at: new Date().toISOString(), user: (s && s.email) || "", name: (s && s.name) || "",
    action: action, detail: String(detail || ""),
    count: (count === 0 || count) ? count : "",
    device: ownDeviceId(), version: (typeof APP_VERSION !== "undefined" ? APP_VERSION : "")
  };
  await ownQueueUpdate(function (q) { q.push(entry); return q; });
  ownLogFlush(now);
}
async function ownLogNow(action, detail, count) { return ownLog(action, detail, count, true); }
async function ownLogFlush(now) {
  /* the guard is set before the first await, or two calls can both get past it
     and the same entries go up twice */
  if (OWN_LOG_BUSY) return;
  if (!now && Date.now() - OWN_LOG_LAST < OWN_LOG_EVERY) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  OWN_LOG_BUSY = true; OWN_LOG_LAST = Date.now();
  try { await ownLogSend(); } finally { OWN_LOG_BUSY = false; }
}
async function ownLogSend() {
  var doc = await ownUsersDoc();
  if (!doc || !doc.log || !doc.log.url) return;
  var batch = (await ownLogQueue()).slice(0, 200);
  if (!batch.length) return;
  var body = JSON.stringify({ token: doc.log.token || "", entries: batch });
  var sent = false;
  try {
    /* text/plain keeps it a simple request, so Apps Script needs no CORS dance */
    var r = await fetch(doc.log.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body });
    try { sent = !!(await r.json()).ok; } catch (e) { sent = r.ok; }
  } catch (e) {
    /* not allowed to read the answer: send it blind rather than lose it */
    try {
      await fetch(doc.log.url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body });
      sent = true;
    } catch (e2) { sent = false; }
  }
  if (sent) {
    var ids = {}; batch.forEach(function (en) { ids[en.id] = 1; });
    await ownQueueUpdate(function (q) { return q.filter(function (en) { return !ids[en.id]; }); });
  }
}
/* searches are logged once the typing stops, and never the same one twice over */
var OWN_LAST_LOG = "";
function ownLogSearch(kind, detail, count) {
  var sig = kind + "|" + detail + "|" + count;
  if (sig === OWN_LAST_LOG) return;
  OWN_LAST_LOG = sig;
  ownLog(kind, detail, count);
}
window.addEventListener("online", function () { ownLogFlush(true); });
/* ---------------- landowner search ----------------

   Replaces the Consent Archive tile (Keith, 22 Sep 2026). The office's Consent
   Filer reads every consent that comes in by email into its register and, after
   each run, publishes one file beside this app: landowners.enc. That file is the
   register, encrypted — it carries landowners' names, addresses and phone
   numbers and sits on a public web host, so without the team passcode it is
   noise.

   · Downloaded whenever the app has a signal (on opening the tile, on start, and
     when the phone comes back online), at most every few minutes.
   · Kept on the device, still encrypted, so the search works with no signal.
   · The passcode is typed once. What is kept is a key the browser made from it
     and will not hand back (a non-extractable CryptoKey), so the passcode itself
     is never stored. A new passcode in the office means a new salt in the file,
     and the device asks again.

   The search works the way the register's dashboard does: type all or part of a
   functional location, or pick a CMR to see every location in it in number
   order (to check the spans either side), then a location to narrow it to one.

   A voltage can be chosen first (Keith, 22 Sep 2026) to cut the CMR list down to
   the circuits at that voltage, and a CMR's locations to the ones at it. What
   the register does not know the voltage of is never hidden — a consent shown
   that was not needed costs a glance, one hidden that was needed costs a wasted
   trip. Typing a location ignores the voltage: a location typed is a location
   wanted. */
var OWN_DEFAULT_URL = "landowners.enc";
var OWN_CFG = LS.get("acorn.owners", {url:OWN_DEFAULT_URL, at:0});
var OWN = {rows:null, meta:null, state:"idle", msg:"", fetching:false,
           q:"", volt:"", cmr:"", fl:"", needKey:false, keySalt:null, user:null, err:"", seen:{}};
var OWN_EVERY = 5*60*1000;      /* don't re-download more often than this */
var OWN_SHOW  = 200;            /* results drawn at once */

function ownUrl(){ return String(OWN_CFG.url||OWN_DEFAULT_URL).trim() || OWN_DEFAULT_URL; }
function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function ownNat(s){
  return String(s||"").toUpperCase().split(/(\d+)/).map(function(p,i){ return i%2? parseInt(p,10) : p; });
}
function ownCmp(a,b){
  var x=ownNat(a), y=ownNat(b);
  for(var i=0;i<Math.max(x.length,y.length);i++){
    if(x[i]===undefined) return -1; if(y[i]===undefined) return 1;
    if(x[i]===y[i]) continue;
    var nx=typeof x[i]==="number", ny=typeof y[i]==="number";
    if(nx&&ny) return x[i]-y[i];
    return String(x[i])<String(y[i])? -1 : 1;
  }
  return 0;
}

async function ownKeyFor(env, passcode){
  var base=await crypto.subtle.importKey("raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(env.salt), iterations:env.iter|0, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function ownOpen(env, key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.iv)}, key, b64(env.data));
  var bytes=new Uint8Array(pt);
  if(env.zip==="gzip"){
    var ds=new DecompressionStream("gzip");
    var out=new Response(new Blob([bytes]).stream().pipeThrough(ds));
    return JSON.parse(await out.text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
/* the kept key, if it was made for this file's salt */
async function ownStoredKey(env){
  try{
    var k=await idbGet("owners.key");
    if(k && k.salt===env.salt && k.iter===env.iter) return k.key;
  }catch(e){}
  return null;
}
/* open whatever copy is on the device */
async function ownLoadLocal(){
  var env=null;
  try{ env=await idbGet("owners.enc"); }catch(e){}
  if(!env){ OWN.state = (await ownSession())? "empty" : "signin"; return false; }
  OWN.meta={updated:env.updated, count:env.count};
  if(env.mode==="users"){                      /* each user has their own password */
    var s=await ownSession();
    if(!s){ OWN.state="signin"; return false; }
    var key=s.key;
    if(env.keyid && s.keyid && env.keyid!==s.keyid) key=null;   /* the office re-keyed */
    if(key){
      try{
        var body=await ownOpen(env,key);
        OWN.rows=ownIndex(body.records||[]); OWN.needKey=false; OWN.state="ready"; OWN.err="";
        s.keyid=env.keyid; OWN.user=s; try{ await idbSet("owners.session", s); }catch(e){}
        return true;
      }catch(e){ key=null; }
    }
    if(await ownRekey(env)){                   /* new key, opened with the key we kept */
      try{
        var body2=await ownOpen(env, OWN.user.key);
        OWN.rows=ownIndex(body2.records||[]); OWN.needKey=false; OWN.state="ready"; OWN.err="";
        OWN.user.keyid=env.keyid; try{ await idbSet("owners.session", OWN.user); }catch(e){}
        return true;
      }catch(e){}
    }
    OWN.rows=null; OWN.state="signin";
    OWN.err=OWN.err||"Sign in again — the office has changed who can use this.";
    return false;
  }
  var k2=await ownStoredKey(env);              /* the older team-passcode file */
  if(!k2){ OWN.needKey=true; OWN.keySalt=env.salt; OWN.state="locked"; return false; }
  try{
    var b=await ownOpen(env,k2);
    OWN.rows=ownIndex(b.records||[]); OWN.needKey=false; OWN.state="ready";
    return true;
  }catch(e){
    OWN.needKey=true; OWN.state="locked"; return false;
  }

function ownIndex(rows){
  rows.sort(function(a,b){
    var c=ownCmp(a.fl,b.fl); if(c) return c;
    return String(b.date||"")<String(a.date||"")? -1 : String(b.date||"")>String(a.date||"")? 1 : 0;
  });
  return rows;
}
/* fetch a newer copy; quiet unless asked */
async function ownFetch(loud){
  if(OWN.fetching) return;
  if(!loud && OWN_CFG.at && Date.now()-OWN_CFG.at < OWN_EVERY) return;
  if(typeof navigator!=="undefined" && navigator.onLine===false){
    if(loud){ OWN.msg="No signal — showing the copy on this device."; ownRedraw(); }
    return;
  }
  OWN.fetching=true; if(loud){ OWN.msg="Checking for new consents…"; ownRedraw(); }
  try{
    await ownFetchUsers(loud);
    var u=ownUrl(); u+=(u.indexOf("?")<0?"?":"&")+"t="+Date.now();
    var r=await fetch(u,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status===404? "the office hasn't published the data yet" : "the server said "+r.status);
    var env=await r.json();
    if(env.format!=="acorn-landowners") throw new Error("that file isn't landowner data");
    var had=null; try{ had=await idbGet("owners.enc"); }catch(e){}
    await idbSet("owners.enc", env);
    OWN_CFG.at=Date.now(); LS.set("acorn.owners", OWN_CFG);
    var changed=!had || had.updated!==env.updated;
    if(changed || !OWN.rows) await ownLoadLocal();
    OWN.msg = changed? "Updated — "+env.count+" consents." : "Up to date.";
  }catch(e){
    OWN.msg="Couldn't download the latest ("+(e && e.message || e)+"). "+
            (OWN.rows? "Showing the copy on this device." : "");
  }finally{
    OWN.fetching=false; ownRedraw();
  }
}
async function ownUnlock(passcode){
  var env=null; try{ env=await idbGet("owners.enc"); }catch(e){}
  if(!env) throw new Error("Nothing downloaded yet — this needs a signal once.");
  var key=await ownKeyFor(env, passcode);
  var body;
  try{ body=await ownOpen(env,key); }
  catch(e){ throw new Error("That passcode doesn't open it."); }
  await idbSet("owners.key", {key:key, salt:env.salt, iter:env.iter});
  OWN.rows=ownIndex(body.records||[]); OWN.needKey=false; OWN.state="ready";
  OWN.meta={updated:env.updated, count:env.count};
}
async function ownForget(){
  try{ await idbSet("owners.key", null); await idbSet("owners.enc", null); await idbSet("owners.session", null); }catch(e){}
  OWN.user=null;
  OWN.rows=null; OWN.meta=null; OWN.state="empty"; OWN_CFG.at=0; LS.set("acorn.owners", OWN_CFG);
}

/* ---- search, the register's rules ---- */
function ownMode(){ return OWN.q.trim()? 1 : OWN.fl? 2 : OWN.cmr? 3 : 0; }
/* What a typed search looks at: the location, the landowner's name and their
   address - a farm is as often known by its name as by whose it is. Every word
   typed has to appear somewhere in those, in any order, so "L26F 085Z" finds
   the span, "smith" finds the landowner, "john smith" and "smith john" both
   find John Smith, and "hill farm" finds the farm. */
function ownWordsOf(r){
  return (String(r.fl||"")+" "+String(r.name||"")+" "+String(r.address||"")).toUpperCase();
}
function ownHits(){
  if(!OWN.rows) return [];
  var m=ownMode(), words=OWN.q.trim().toUpperCase().split(/[\s,]+/).filter(Boolean);
  if(m===1) return OWN.rows.filter(function(r){
    var hay=ownWordsOf(r);
    return words.every(function(w){ return hay.indexOf(w)>=0; });
  });
  if(m===2) return OWN.rows.filter(function(r){ return r.fl===OWN.fl; });
  if(m===3){
    var at={}; ownFls(OWN.cmr).forEach(function(f){ at[f]=1; });
    return OWN.rows.filter(function(r){ return r.cmr===OWN.cmr && at[r.fl]; });
  }
  return [];
}
/* Voltages as the register writes them, and as the rest of Acorn names them:
   "11 kV", "11KV" and "11kV" are one voltage. */
var OWN_VOLTS=["LV","11kV","33kV","132kV"];
function ownVolt(v){
  var k=String(v||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!k) return "";
  for(var i=0;i<OWN_VOLTS.length;i++) if(OWN_VOLTS[i].toUpperCase()===k) return OWN_VOLTS[i];
  return k.replace(/KV$/,"kV");
}
/* the voltages in the register: the usual four in their usual order, then any other */
function ownVolts(){
  var s={}; (OWN.rows||[]).forEach(function(r){ var v=ownVolt(r.volt); if(v) s[v]=1; });
  var known=OWN_VOLTS.filter(function(v){ return s[v]; });
  return known.concat(Object.keys(s).filter(function(v){ return OWN_VOLTS.indexOf(v)<0; }).sort(ownCmp));
}
/* group -> the voltages its consents record; kept unless those are known and none is the one chosen */
function ownAtVolt(rows, key){
  var g={};
  rows.forEach(function(r){ var k=key(r), v=ownVolt(r.volt); if(!g[k]) g[k]={}; if(v) g[k][v]=1; });
  return Object.keys(g).filter(function(k){
    return !OWN.volt || !Object.keys(g[k]).length || g[k][OWN.volt];
  }).sort(ownCmp);
}
/* every CMR, or (by default) only those at the chosen voltage */
function ownCmrs(any){
  var rows=(OWN.rows||[]).filter(function(r){ return r.cmr; });
  if(any){ var s={}; rows.forEach(function(r){ s[r.cmr]=1; }); return Object.keys(s).sort(ownCmp); }
  return ownAtVolt(rows, function(r){ return r.cmr; });
}
function ownFls(cmr){
  return ownAtVolt((OWN.rows||[]).filter(function(r){ return r.cmr===cmr; }), function(r){ return r.fl; });
}
function ownStatus(r){
  if(!r.expiry) return "";
  return r.expiry < today() ? "Expired" : "Current";
}
function ownWhen(iso){
  if(!iso) return "";
  var d=new Date(iso); if(isNaN(d)) return iso;
  return ukDate(iso.slice(0,10))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function ownTel(v){ return String(v||"").replace(/[^\d+]/g,""); }

function ownCard(r, first){
  var st=ownStatus(r);
  var line=function(k,v,html){ return v? '<div class="own-l"><span class="own-k">'+k+'</span><span class="own-v">'+(html||esc(v))+'</span></div>' : ''; };
  var w3=String(r.w3w||"").replace(/^\/+/,"");
  var w3ok=/^[a-z]+\.[a-z]+\.[a-z]+$/i.test(w3);
  return '<div class="own-c'+(first?' first':'')+(OWN.fl&&r.fl===OWN.fl&&ownMode()!==2?' pick':'')+'"'+
    ' data-fl="'+esc(r.fl||"")+'" data-own="'+esc(r.name||"")+'">'+
    (first? '<div class="own-fl">'+esc(r.fl)+'<span class="own-chips">'+
       (r.volt? '<span class="own-chip">'+esc(r.volt)+'</span>':'')+
       (r.cmr? '<span class="own-chip">'+esc(r.cmr)+'</span>':'')+'</span></div>' : '')+
    '<div class="own-top"><span class="own-name">'+esc(r.name||"Landowner not recorded")+'</span>'+
      (st? '<span class="own-st '+(st==="Expired"?'x':'ok')+'">'+st+'</span>':'')+'</div>'+
    '<div class="own-dates">Signed '+(r.date? esc(ukDate(r.date)) : '—')+
      (r.expiry? ' · expires '+esc(ukDate(r.expiry)) : '')+'</div>'+
    line("Address", r.address)+
    line("Phone", r.phone, r.phone? '<a href="tel:'+esc(ownTel(r.phone))+'">'+esc(r.phone)+'</a>':'')+
    line("Email", r.email, r.email? '<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'')+
    line("Site", r.site)+
    line("what3words", r.w3w, w3ok? '<a href="https://what3words.com/'+esc(w3)+'" target="_blank" rel="noopener">///'+esc(w3)+'</a>' : '')+
    line("Access", r.access)+
    line("Arrangements", r.arrange)+
    line("Poles", [r.pole, r.prev].filter(Boolean).join(" – "))+
    line("Notice", r.notice)+
    line("Shutdown", r.shutdown)+
    line("Arisings", r.arisings)+
    (r.trees? '<details class="own-trees"><summary>Tree schedule</summary><div>'+
       esc(r.trees).split("; ").join("<br>")+'</div></details>' : '')+
    line("Surveyor", r.surveyor? r.surveyor+(r.surveyorPhone? " · "+r.surveyorPhone:"") : "")+
  '</div>';
}

function ownResultsHtml(){
  if(!OWN.rows) return "";
  var m=ownMode();
  if(!m) return '<p class="muted own-hint">Type part of a functional location — <b>085Z</b> or '+
    '<b>L26F-000-085</b> — or a landowner\'s name or address, in any order. Or choose a CMR.</p>';
  var hits=ownHits();
  if(!hits.length){
    var near='';
    if(m===1 && OWN.q.trim().length>=3){
      var c=OWN.q.trim().toUpperCase().split(/[\s-]+/)[0].replace(/^[A-Z]{3}R0*/,"");
      if(ownCmrs(true).indexOf(c)>=0) near=' <button class="btn" data-own-cmr="'+esc(c)+'">Show all of '+esc(c)+'</button>';
    }
    if(m===2 && OWN.cmr) near=' <button class="btn" data-own-cmr="'+esc(OWN.cmr)+'">Show the rest of '+esc(OWN.cmr)+'</button>';
    return '<div class="note">No consents on record for that.'+near+'</div>';
  }
  var fls={}; hits.forEach(function(r){ fls[r.fl]=1; });
  var nf=Object.keys(fls).length;
  var h='<div class="own-count">'+hits.length+' consent'+(hits.length===1?'':'s')+
        (nf>1? ' across '+nf+' locations':'')+(m===3 && OWN.volt? ' at '+esc(OWN.volt):'')+
        (m===2 && OWN.cmr? ' · <button class="linkbtn" data-own-cmr="'+esc(OWN.cmr)+'">show all of '+esc(OWN.cmr)+'</button>':'')+
        '</div>';
  var last=null;
  hits.slice(0,OWN_SHOW).forEach(function(r){ h+=ownCard(r, r.fl!==last); last=r.fl; });
  if(hits.length>OWN_SHOW) h+='<div class="note">Showing the first '+OWN_SHOW+' — narrow the search to see the rest.</div>';
  return h;
}

function ownStatusLine(){
  var m=OWN.meta;
  var s = m? 'Office copy of '+esc(ownWhen(m.updated))+' · '+(m.count||0)+' consents' : 'Not downloaded yet';
  return '<div class="own-bar"><span>'+s+(OWN.msg? '<br><span class="muted">'+esc(OWN.msg)+'</span>':'')+'</span>'+
         '<button class="btn" id="ownRefresh"'+(OWN.fetching?' disabled':'')+'>'+
         (OWN.fetching? 'Checking…' : 'Refresh')+'</button></div>';
}

function renderOwners(){
  dock.classList.add("hide");
  var b='<div class="stack">';
  if(!OWN.rows && OWN.state!=="locked" && OWN.state!=="signin"){
    b+='<div class="card"><div class="bd">'+ownStatusLine()+
       '<p class="muted" style="margin-top:10px">The landowner details come from the office\'s consent register. '+
       'This device needs a signal once to fetch them; after that they are searchable anywhere.</p></div></div>';
    app.innerHTML=b+'</div>';
    ownWire();
    if(OWN.state==="idle"){ OWN.state="loading"; ownLoadLocal().then(function(){ ownRedraw(); ownFetch(false); }); }
    return;
  }
  if(OWN.state==="signin"){
    b+='<div class="card"><div class="hd"><h2>Sign in</h2></div><div class="bd">'+
       '<p class="muted">The landowner details hold people\'s names, addresses and phone numbers, so each '+
       'user signs in with their own password. The office gives you both. It is needed once on this device, '+
       'while it has a connection; after that the search works offline too.</p>'+
       (OWN.err? '<div class="note">'+esc(OWN.err)+'</div>' : '')+
       '<label class="fl"><span class="k">Email address</span>'+
       '<input type="email" id="ownEmail" autocomplete="username" inputmode="email" spellcheck="false" '+
       'value="'+esc(LS.get("acorn.owners.email",""))+'"></label>'+
       '<label class="fl"><span class="k">Password</span>'+
       '<input type="password" id="ownPass" autocomplete="current-password"></label>'+
       '<div class="own-err" id="ownErr"></div>'+
       '<div class="btnrow" style="margin-top:12px"><button class="btn primary wide" id="ownGo">Sign in</button></div>'+
       '</div></div>';
    app.innerHTML=b+'</div>';
    var go=document.getElementById("ownGo"), em=document.getElementById("ownEmail"), pw=document.getElementById("ownPass");
    var run=async function(){
      go.disabled=true; go.textContent="Signing in…";
      try{
        await ownSignIn(em.value, pw.value);
        LS.set("acorn.owners.email", String(em.value||"").trim());
        render();
      }catch(e){
        document.getElementById("ownErr").textContent=e.message||String(e);
        go.disabled=false; go.textContent="Sign in";
      }
    };
    go.onclick=run;
    pw.onkeydown=function(e){ if(e.key==="Enter") run(); };
    em.onkeydown=function(e){ if(e.key==="Enter") pw.focus(); };
    /* say straight away when there is no user list to sign in against, and offer
       another go: a file just uploaded can take a minute or two to be served */
    ownFetchUsers(false).then(function(d){
      if(d) return;
      var el=document.getElementById("ownErr"); if(!el) return;
      el.innerHTML=esc(ownNoUsersWhy())+' <button class="linkbtn" id="ownRetry">Try again</button>';
      var rt=document.getElementById("ownRetry");
      if(rt) rt.onclick=async function(){
        rt.textContent="Trying…"; rt.disabled=true;
        var got=await ownFetchUsers(false);
        if(got){ el.textContent=""; toast("User list found — sign in."); }
        else { el.innerHTML=esc(ownNoUsersWhy())+' <button class="linkbtn" id="ownRetry">Try again</button>'; render(); }
      };
    }).catch(function(){});
    setTimeout(function(){ try{ (em.value? pw:em).focus(); }catch(e){} },30);
    return;
  }
  if(OWN.state==="locked"){
    b+='<div class="card"><div class="hd"><h2>Enter the team passcode</h2></div><div class="bd">'+
       '<p class="muted">The landowner details are locked because they hold people\'s names, addresses and phone '+
       'numbers. Ask the office for the passcode — it is needed once on this device, and again only if the '+
       'office changes it.</p>'+
       '<label class="fl"><span class="k">Passcode</span><input type="password" id="ownPass" autocomplete="off"></label>'+
       '<div class="own-err" id="ownErr"></div>'+
       '<div class="btnrow" style="margin-top:12px"><button class="btn primary wide" id="ownUnlock">Unlock</button></div>'+
       '</div></div>';
    app.innerHTML=b+'</div>';
    var go=document.getElementById("ownUnlock"), pw=document.getElementById("ownPass");
    var run=async function(){
      go.disabled=true; go.textContent="Opening…";
      try{ await ownUnlock(pw.value); render(); }
      catch(e){ document.getElementById("ownErr").textContent=e.message||String(e); go.disabled=false; go.textContent="Unlock"; }
    };
    go.onclick=run; pw.onkeydown=function(e){ if(e.key==="Enter") run(); };
    setTimeout(function(){ try{ pw.focus(); }catch(e){} },30);
    return;
  }
  var volts=ownVolts();
  if(OWN.volt && volts.indexOf(OWN.volt)<0) OWN.volt="";   /* gone from a newer register */
  var cmrs=ownCmrs();
  b+='<div class="card"><div class="bd">'+ownStatusLine()+'</div></div>';
  b+='<div class="card"><div class="bd">'+
     '<label class="fl"><span class="k">Search location, landowner or address</span>'+
     '<input type="text" inputmode="search" id="ownQ" value="'+esc(OWN.q)+'" autocomplete="off" spellcheck="false" '+
     'placeholder="e.g. L26F 085Z, 000-062T, Smith or Hill Farm"></label>'+
     '<div class="grid2" style="margin-top:8px">'+
       (volts.length>1? '<label class="fl"><span class="k">Voltage</span><select id="ownVolt">'+
         '<option value="">All voltages</option>'+
         volts.map(function(v){ return '<option'+(v===OWN.volt?' selected':'')+'>'+esc(v)+'</option>'; }).join("")+
         '</select></label>' : '')+
       '<label class="fl"><span class="k">'+(OWN.volt? 'or choose a '+esc(OWN.volt)+' CMR' : 'or choose a CMR')+'</span><select id="ownCmr"><option value="">Choose…</option>'+
       cmrs.map(function(c){ return '<option'+(c===OWN.cmr?' selected':'')+'>'+esc(c)+'</option>'; }).join("")+
       '</select></label>'+
       '<label class="fl"><span class="k">then a functional location</span><select id="ownFl"'+(OWN.cmr?'':' disabled')+'>'+
       '<option value="">All of '+(OWN.cmr? esc(OWN.cmr)+(OWN.volt? ' at '+esc(OWN.volt):'') : 'the CMR')+'</option>'+
       (OWN.cmr? ownFls(OWN.cmr).map(function(f){ return '<option value="'+esc(f)+'"'+(f===OWN.fl?' selected':'')+'>'+esc(f)+'</option>'; }).join("") : '')+
       '</select></label>'+
     '</div>'+
     '<div class="btnrow" style="margin-top:10px"><button class="btn wide" id="ownClear">Clear search</button></div>'+
     '</div></div>';
  b+='<div id="ownRes">'+ownResultsHtml()+'</div>';
  app.innerHTML=b+'</div>';
  ownWire();
  ownFetch(false);
}
function ownWireResults(){
  /* what was actually looked at: a card tapped, a number or address followed */
  Array.prototype.forEach.call(app.querySelectorAll(".own-c"),function(cd){
    cd.addEventListener("click", function(){
      var k=cd.getAttribute("data-fl")+"|"+cd.getAttribute("data-own");
      if(OWN.seen[k]) return; OWN.seen[k]=1;
      ownLog("opened record", cd.getAttribute("data-fl")+" - "+(cd.getAttribute("data-own")||"landowner"), null);
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-own-cmr]"),function(bn){
    bn.onclick=function(){
      OWN.q=""; OWN.fl=""; OWN.cmr=bn.getAttribute("data-own-cmr");
      if(ownCmrs().indexOf(OWN.cmr)<0) OWN.volt="";       /* a CMR offered is a CMR shown */
      render(); window.scrollTo(0,0);
    };
  });
}
function ownWire(){
  var rf=document.getElementById("ownRefresh");
  if(rf) rf.onclick=function(){ ownFetch(true); };
  var q=document.getElementById("ownQ"), cm=document.getElementById("ownCmr"), fl=document.getElementById("ownFl"),
      vo=document.getElementById("ownVolt");
  var t=null;
  if(q) q.oninput=function(){
    OWN.q=q.value;
    if(OWN.q.trim() && (OWN.cmr||OWN.fl)){ OWN.cmr=""; OWN.fl=""; if(cm) cm.value=""; if(fl){ fl.innerHTML='<option value="">All of the CMR</option>'; fl.disabled=true; } }
    clearTimeout(t); t=setTimeout(function(){ var r=document.getElementById("ownRes"); if(r){ r.innerHTML=ownResultsHtml(); ownWireResults(); } },150);
    clearTimeout(OWN._lt); OWN._lt=setTimeout(function(){
      var v=OWN.q.trim(); if(v.length>=3) ownLogSearch("search", v, ownHits().length);
    }, 1200);
  };
  if(vo) vo.onchange=function(){
    OWN.volt=vo.value;
    if(OWN.cmr && ownCmrs().indexOf(OWN.cmr)<0){ OWN.cmr=""; OWN.fl=""; }
    else if(OWN.fl && ownFls(OWN.cmr).indexOf(OWN.fl)<0) OWN.fl="";
    render();
  };
  if(cm) cm.onchange=function(){
    OWN.cmr=cm.value; OWN.fl=""; OWN.q=""; render();
    if(OWN.cmr) ownLogSearch("chose CMR", OWN.cmr+(OWN.volt? " at "+OWN.volt : ""), ownHits().length);
  };
  if(fl) fl.onchange=function(){
    OWN.fl=fl.value; OWN.q=""; render();
    if(OWN.fl) ownLogSearch("chose location", OWN.fl, ownHits().length);
  };
  var cl=document.getElementById("ownClear");
  if(cl) cl.onclick=function(){ OWN.q=""; OWN.cmr=""; OWN.fl=""; render(); try{ document.getElementById("ownQ").focus(); }catch(e){} };
  ownWireResults();
}
/* redraw only if the search is what is on screen */
function ownRedraw(){ if(view==="owners") render(); }
function ownTileLine(){
  var m=OWN.meta;
  if(!m){ try{ var t=LS.get("acorn.owners.count",0); return t? t+" consents" : ""; }catch(e){ return ""; } }
  LS.set("acorn.owners.count", m.count||0);
  return (m.count||0)+" consents";
}

/* Settings: where the data comes from, and a way to lock the device again */
function ownersCard(){
  var who=(OWN.user && OWN.user.email)? 'Signed in as <b>'+esc(OWN.user.email)+'</b>. ' : 'Not signed in. ';
  return '<div class="card"><div class="hd"><h2>Landowner search</h2></div><div class="bd">'+
    '<p class="muted">'+who+'Downloaded from the office whenever there is a signal and kept on this device, '+
    'encrypted, for use with none. '+
    (OWN.meta? 'The copy here is from '+esc(ownWhen(OWN.meta.updated))+' ('+(OWN.meta.count||0)+' consents).' : 'Nothing downloaded yet.')+
    '</p>'+
    '<label class="fl"><span class="k">Address of the data file</span>'+
    '<input type="text" id="ownUrl" value="'+esc(ownUrl())+'" spellcheck="false" autocomplete="off"></label>'+
    '<p class="muted" style="font-size:12.5px">Leave as <b>'+OWN_DEFAULT_URL+'</b> when the office publishes it beside Acorn.</p>'+
    '<div class="btnrow" style="margin-top:10px"><button class="btn" id="ownSaveUrl">Save</button>'+
    '<button class="btn" id="ownSignOut">Sign out</button>'+
    '<button class="btn" id="ownLock">Remove it from this device</button></div></div></div>';
}
function wireOwnersCard(){
  var so=document.getElementById("ownSignOut");
  if(so) so.onclick=async function(){
    if(!window.confirm("Sign out of the landowner search on this phone? You will need your password again.")) return;
    await ownSignOut(false); toast("Signed out."); render();
  };
  var s=document.getElementById("ownSaveUrl");
  if(s) s.onclick=function(){
    OWN_CFG.url=document.getElementById("ownUrl").value.trim()||OWN_DEFAULT_URL; OWN_CFG.at=0;
    LS.set("acorn.owners",OWN_CFG); toast("Saved — it will be fetched next time there is a signal."); ownFetch(true);
  };
  var l=document.getElementById("ownLock");
  if(l) l.onclick=async function(){
    if(!window.confirm("Remove the landowner details from this phone? Signing in again brings them back.")) return;
    await ownForget(); toast("Removed from this device."); render();
  };
}

/* start-up and signal: fetch quietly in the background */
window.addEventListener("online", function(){ ownFetch(false); });
setTimeout(function(){
  ownSession().then(function(){ return ownLoadLocal(); })
    .then(function(){ ownFetch(false); ownLogFlush(true); }).catch(function(){});
}, 1500);</script>
<script>
/* The worker is registered after the app is up, and a failure here never stops
   the app running - without it the search still works, it just will not open
   with no signal. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
